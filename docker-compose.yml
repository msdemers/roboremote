services:
  physics:
    build: ./physics
    volumes:
      - ./models:/models:ro
    environment:
      PHYSICS_ADDR: "${PHYSICS_ADDR}"
    expose:
      - "${PHYSICS_PORT}"

  viz:
    build: ./viz
    volumes:
      - ./models:/models:ro

  server:
    build: ./server
    environment:
      PHYSICS_SIDECAR_ADDR: "${PHYSICS_SIDECAR_ADDR}"
      SERVER_ADDR: "${SERVER_ADDR}"
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - physics

  tui:
    build: ./tui
    environment:
      SERVER_ADDR: "${TUI_SERVER_ADDR}"
    depends_on:
      - server
    stdin_open: true
    tty: true