services:
  physics:
    build: ./physics
    volumes:
      - ./models:/models:ro
    environment:
      PHYSICS_ADDR: "0.0.0.0:50052"
    expose:
      - "50052"
  
  viz:
    build: ./viz
    volumes:
      - ./models:/models:ro

  server:
    build: ./server
    environment:
      PHYSICS_SIDECAR_ADDR: "physics:50052"
      SERVER_ADDR: "0.0.0.0:50051"
    ports:
      - "50051:50051"
    depends_on:
      - physics

  tui:
    build: ./tui
    environment:
      SERVER_ADDR: "server:50051"
    depends_on:
      - server
    stdin_open: true
    tty: true
