syntax = "proto3";

package roboremote.arm.v1;

option go_package = "github.com/msdemers/roboremote/proto/gen/go/arm/v1";

// --- Value Types 

message Coordinates {
  repeated double q = 1; // generalized coordinates q, radians, length nq
}

message Velocities {
  repeated double v = 1; // generalized velocities v, radians/sec, length nv
}

message Actuation {
  repeated double tau = 1; // motor torques/forces tau, Nm or N, length nv
}

message CartesianPose {
  // end-effector position in world frame, meters
  double x = 1;
  double y = 2;
  double z = 3;
  // end-effector attitude, unit quaternion, scalar-last {x,y,z,w}, Hamilton
  double qx = 4;
  double qy = 5;
  double qz = 6;
  double qw = 7;
}

// --- Status 

enum ArmStatus {
  ARM_STATUS_UNSPECIFIED = 0;
  ARM_STATUS_IDLE        = 1;
  ARM_STATUS_RUNNING     = 2;
  ARM_STATUS_FAULT       = 3;
}

// --- Control Inputs 

enum ControlMode {
  CONTROL_MODE_UNSPECIFIED          = 0;
  CONTROL_MODE_GRAVITY_COMP         = 1;
  CONTROL_MODE_TASK_PD_COMPENSATED  = 2;
  CONTROL_MODE_TASK_PD_RAW          = 3;
  CONTROL_MODE_JOINT_PD_COMPENSATED = 4;
  CONTROL_MODE_JOINT_PD_RAW         = 5;
}

// --- Core State 

message ArmState {
  ArmStatus status = 1;
  ControlMode active_mode = 2;
  oneof active_target {
    Coordinates joint_target = 3;
    CartesianPose cartesian_target = 4;
  }
  double sim_time = 5; // seconds of simulated time
  Coordinates q = 6;
  Velocities v = 7;
  Actuation tau = 8;
  CartesianPose end_effector = 9;
}

// --- Model Description 

message JointInfo {
  // Unique name and ID
  string name = 1;
  uint32 id = 2;
  uint32 parent_id = 3;

  // Kinematic parameters
  enum JointType {
    UNKNOWN_JOINT = 0;
    REVOLUTE_JOINT = 1; // nq = nv = 1, units: radians, radians/sec, Nm
    PRISMATIC_JOINT = 2; // nq = nv = 1, units: meters, meters/sec, N
    SPHERICAL_JOINT = 3;
    PLANAR_JOINT = 4;
    FREE_FLYER_JOINT = 5;
    FIXED_JOINT = 6;
  }
  JointType type = 4;

  // Degrees of Freedom & Configuration Dimensions
  uint32 nq = 5; // Size of the joint's configuration space vector
  uint32 nv = 6; // Size of the joint's tangent/velocity vector

  // Starting Indices in System Vectors
  uint32 idx_q = 7; // Starting index in the system configuration vector q
  uint32 idx_v = 8; // Starting index in the system velocity vector v

  // Dynamic & Kinematic Limits
  repeated double position_limit_lower = 9;
  repeated double position_limit_upper = 10;
  repeated double velocity_limit = 11;
  repeated double effort_limit = 12;
}

message ModelDescriptor {
  string model_name = 1;
  string model_version = 2;
  uint32 nq = 3;
  uint32 nv = 4;
  repeated JointInfo joints = 5;
}

// --- Streaming Messages 

message StreamEnvelope {
  oneof payload {
    ModelDescriptor descriptor = 1;
    ArmState        state      = 2;
  }
}

// --- Services 

service ArmSimService {
  
}

message SetControlModeRequest {
  ControlMode mode = 1;
}

message SetControlModeResponse {
  bool   success = 1;
  string message = 2;
}