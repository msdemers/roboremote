[project]
name = "physics"
version = "0.1.0"
description = "A physics sidecar for simulating and serving robot dynamics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.82.1",
    "grpcio-reflection>=1.82.1",
    "numpy>=2.4.6",
    "pin>=4.0.0",
    "roboremote-proto",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv.sources]
roboremote-proto = { path = "../proto/gen/python", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
